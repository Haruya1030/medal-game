<script>

/* =====================================
   Supabase
===================================== */

const SUPABASE_URL=
"https://kizcfsgfeurwlpwcfrzp.supabase.co";

/*
 ↓ここだけ自分のPublishable keyに変更
*/
const SUPABASE_PUBLISHABLE_KEY=
"sb_publishable_onwTGaCaOPH3LerDm0tXOA_KnjyS2hG";


const supabaseClient=
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_PUBLISHABLE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true,
   storage:window.localStorage
  }
 }
);


/* =====================================
   現在ユーザー
===================================== */

let currentUser=null;
let currentProfile=null;


/* =====================================
   メッセージ
===================================== */

function loginMessage(text){
 document.getElementById(
  "loginMessage"
 ).textContent=text;
}


/* =====================================
   登録
===================================== */

async function register(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 if(!email||!password){
  loginMessage(
   "メールアドレスとパスワードを入力してください。"
  );
  return;
 }

 if(password.length<6){
  loginMessage(
   "パスワードは6文字以上にしてください。"
  );
  return;
 }

 const {data,error}=
 await supabaseClient.auth.signUp({
  email,
  password,
  options:{
   emailRedirectTo:
    window.location.origin+
    window.location.pathname
  }
 });

 if(error){
  loginMessage(
   "登録できませんでした。\n"+
   error.message
  );
  return;
 }

 if(data.session){
  loginMessage("登録・ログインしました。");
  await loadProfile();
 }else{
  loginMessage(
   "📧 登録しました！\n"+
   "確認メールを送信しました。\n"+
   "メール内のリンクを押してからログインしてください。"
  );
 }
}


/* =====================================
   ログイン
===================================== */

async function login(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 const remember=
 document.getElementById("rememberLogin")?.checked!==false;

 if(!email||!password){
  loginMessage(
   "メールアドレスとパスワードを入力してください。"
  );
  return;
 }

 if(remember){
  localStorage.setItem("medalGameRememberEmail",email);
 }else{
  localStorage.removeItem("medalGameRememberEmail");
 }

 const {data,error}=
 await supabaseClient.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  const message=String(error.message||"");

  if(message.toLowerCase().includes("email not confirmed")){
   loginMessage(
    "📧 メールアドレスの確認が完了していません。\n"+
    "確認メールのリンクを押してから、もう一度ログインしてください。"
   );
  }else{
   loginMessage(
    "ログインできませんでした。\n"+
    message
   );
  }
  return;
 }

 await loadProfile();
}


/* =====================================
   確認メール再送
===================================== */

async function resendVerification(){

 const email=
 document.getElementById("email").value.trim();

 if(!email){
  loginMessage(
   "メールアドレスを入力してください。"
  );
  return;
 }

 const {error}=
 await supabaseClient.auth.resend({
  type:"signup",
  email,
  options:{
   emailRedirectTo:
    window.location.origin+
    window.location.pathname
  }
 });

 if(error){
  loginMessage(
   "確認メールを再送できませんでした。\n"+
   error.message
  );
  return;
 }

 loginMessage(
  "📧 確認メールを再送しました。メールを確認してください。"
 );
}

/* =====================================
   保存したメールアドレスを復元
===================================== */

function restoreLoginData(){

 const savedEmail=
  localStorage.getItem("medalGameRememberEmail");

 if(savedEmail){
  const input=document.getElementById("email");
  if(input) input.value=savedEmail;
 }
}

/* =====================================
   PWAインストール
===================================== */

let deferredInstallPrompt=null;

window.addEventListener("beforeinstallprompt",(event)=>{

 event.preventDefault();
 deferredInstallPrompt=event;

 const button=document.getElementById("installAppButton");
 if(button) button.classList.remove("hidden");
});

async function installApp(){

 if(!deferredInstallPrompt){
  loginMessage(
   "この端末・ブラウザでは、現在インストールできません。"
  );
  return;
 }

 deferredInstallPrompt.prompt();
 const result=await deferredInstallPrompt.userChoice;
 deferredInstallPrompt=null;

 const button=document.getElementById("installAppButton");
 if(button) button.classList.add("hidden");

 if(result.outcome==="accepted"){
  loginMessage("📱 アプリをインストールしました！");
 }
}

window.addEventListener("appinstalled",()=>{
 const button=document.getElementById("installAppButton");
 if(button) button.classList.add("hidden");
});

/* =====================================
   Service Worker
===================================== */

if("serviceWorker" in navigator){
 window.addEventListener("load",async()=>{
  try{
   const registration=await navigator.serviceWorker.register(
    "./sw.js",
    {scope:"./"}
   );
   console.log("Service Worker 登録成功:",registration.scope);
  }catch(error){
   console.error("Service Worker 登録失敗:",error);
  }
 });
}

/* =====================================
   プロフィール
===================================== */

async function loadProfile(){

 const {data,error}=
 await supabaseClient.auth.getUser();

 if(error||!data.user){
  showLogin();
  return;
 }

 currentUser=data.user;

 const result=
 await supabaseClient
 .from("profiles")
 .select(
  "id,username,display_name,role,medals"
 )
 .eq("id",currentUser.id)
 .single();

 if(result.error){

  alert(
   "プロフィール取得エラー\n"+
   result.error.message
  );

  return;
 }

 currentProfile=result.data;

 document
 .getElementById("loginPage")
 .classList.add("hidden");

 document
 .getElementById("mainPage")
 .classList.remove("hidden");

 document
 .getElementById("welcome")
 .textContent=
 "こんにちは、"+
 (
  currentProfile.display_name||
  currentProfile.username||
  currentUser.email
 )+
 " さん";

 document
 .getElementById("medalCount")
 .textContent=
 currentProfile.medals;

 if(currentProfile.role==="admin"){

  document
  .getElementById("adminPage")
  .classList.remove("hidden");

 }else{

  document
  .getElementById("adminPage")
  .classList.add("hidden");

 }
}


/* =====================================
   ユーザー一覧
===================================== */

async function loadUsers(){

 if(!currentProfile||
    currentProfile.role!=="admin"){

  alert("管理者権限がありません。");
  return;
 }

 const {data,error}=
 await supabaseClient
 .from("profiles")
 .select(
  "id,username,display_name,role,medals"
 )
 .order("created_at",{ascending:false});

 if(error){
  alert(error.message);
  return;
 }

 const list=
 document.getElementById("userList");

 list.innerHTML="<h3>👤 ユーザー一覧</h3>";

 data.forEach(user=>{

  const div=
  document.createElement("div");

  div.className="user";

  div.innerHTML=`

   <strong>
   ${escapeHtml(
    user.display_name||
    user.username||
    "ユーザー"
   )}
   </strong>

   <br>

   🪙
   <span id="medal-${user.id}">
   ${user.medals}
   </span> 枚

   <br>

   <small>
   権限：${escapeHtml(user.role)}
   </small>

   <input
    id="amount-${user.id}"
    type="number"
    min="1"
    value="100"
    placeholder="枚数">

   <input
    id="reason-${user.id}"
    value="管理者によるメダル変更"
    placeholder="理由">

   <button
    onclick="changeMedals('${user.id}',1)">
    ➕ 増やす
   </button>

   <button
    onclick="changeMedals('${user.id}',-1)">
    ➖ 減らす
   </button>
  `;

  list.appendChild(div);
 });
}


/* =====================================
   メダル遠隔増減
===================================== */

async function changeMedals(
 userId,
 direction
){

 const amount=
 Number(
  document.getElementById(
   "amount-"+userId
  ).value
 );

 const reason=
 document.getElementById(
  "reason-"+userId
 ).value.trim();

 if(!Number.isInteger(amount)||amount<=0){
  alert("1以上の整数を入力してください。");
  return;
 }

 const {data,error}=
 await supabaseClient.rpc(
  "admin_change_medals",
  {
   target_user_id:userId,
   medal_amount:direction*amount,
   reason:
    reason||
    "管理者によるメダル変更"
  }
 );

 if(error){
  alert(
   "変更できませんでした。\n"+
   error.message
  );
  return;
 }

 document.getElementById(
  "medal-"+userId
 ).textContent=data;

 if(
  currentUser &&
  userId===currentUser.id
 ){
  document.getElementById(
   "medalCount"
  ).textContent=data;
 }

 alert(
  "メダル変更完了！\n"+
  "現在："+data+"枚"
 );
}


/* =====================================
   クレーン
===================================== */

let craneX=45;

function openCrane(){

 hideAllPages();

 document
 .getElementById("cranePage")
 .classList.remove("hidden");
}

function moveCrane(direction){

 craneX+=direction*5;

 if(craneX<5) craneX=5;
 if(craneX>90) craneX=90;

 document
 .getElementById("crane")
 .style.left=
 craneX+"%";
}

function grabPrize(){

 const message=
 document.getElementById(
  "craneMessage"
 );

 message.textContent=
 "🦾 アーム下降……";

 setTimeout(()=>{
  message.textContent=
   "🤏 景品をつかんでいます……";
 },700);

 setTimeout(()=>{
  const success=
   Math.random()<0.35;

  if(success){

   message.textContent=
    "🎉 景品ゲット！";

  }else{

   message.textContent=

   ログアウト
===================================== */

 await supabaseClient.auth.signOut();

}

 .getElementById("loginPage")
 .classList.remove("hidden");

/* =====================================
   HTMLエスケープ
===================================== */

function escapeHtml(value){

 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* =====================================
   アップデート
===================================== */

let waitingServiceWorker=null;
let isReloadingAfterUpdate=false;

function setUpdateMessage(text){
 const el=document.getElementById("updateMessage");
 if(el) el.textContent=text;
}

function showUpdateButton(){
 const button=document.getElementById("applyUpdateButton");
 if(button) button.classList.remove("hidden");
}

function applyAppUpdate(){
 if(!waitingServiceWorker){
  checkForUpdate();
  return;
 }

 waitingServiceWorker.postMessage({type:"SKIP_WAITING"});
 setUpdateMessage("✨ アップデートを適用しています……");
}

async function checkForUpdate(){
 if(!("serviceWorker" in navigator)){
  setUpdateMessage("このブラウザではアップデート機能を利用できません。");
  return;
 }

 try{
  const registration=await navigator.serviceWorker.getRegistration("./");

  if(!registration){
   setUpdateMessage("アップデート機能を準備中です。");
   return;
  }

  await registration.update();

  if(registration.waiting){
   waitingServiceWorker=registration.waiting;
   setUpdateMessage("🆕 新しいバージョンがあります！");
   showUpdateButton();
  }else{
   setUpdateMessage("✅ 最新バージョンです。");
  }
 }catch(error){
  console.error("アップデート確認失敗:",error);
  setUpdateMessage("アップデート確認に失敗しました。");
 }
}

function setupUpdateListener(registration){
 if(!registration) return;

 if(registration.waiting){
  waitingServiceWorker=registration.waiting;
  showUpdateButton();
 }

 registration.addEventListener("updatefound",()=>{
  const newWorker=registration.installing;
  if(!newWorker) return;

  newWorker.addEventListener("statechange",()=>{
   if(
    newWorker.state==="installed" &&
    navigator.serviceWorker.controller
   ){
    waitingServiceWorker=newWorker;
    setUpdateMessage("🆕 新しいバージョンがあります！");
    showUpdateButton();
   }
  });
 });
}

if("serviceWorker" in navigator){
 window.addEventListener("load",async()=>{
  try{
   const registration=await navigator.serviceWorker.register("./sw.js",{
    scope:"./"
   });

   console.log("Service Worker 登録成功:",registration.scope);
   setupUpdateListener(registration);

   // 5分ごとに新しいバージョンを確認
   setInterval(()=>{
    registration.update().catch(()=>{});
   },5*60*1000);

   window.addEventListener("focus",()=>{
    registration.update().catch(()=>{});
   });
  }catch(error){
   console.error("Service Worker 登録失敗:",error);
  }
 });

 navigator.serviceWorker.addEventListener("controllerchange",()=>{
  if(isReloadingAfterUpdate) return;
  if(waitingServiceWorker===null) return;

  isReloadingAfterUpdate=true;
  window.location.reload();
 });
}

async function startApp(){

 restoreLoginData();

 const {data,error}=
 await supabaseClient.auth.getSession();

 if(error){
  console.error("セッション取得エラー:",error);
 }

 if(data.session){
  await loadProfile();
 }else{
  showLogin();
 }
}

supabaseClient.auth.onAuthStateChange((event,session)=>{

 if(event==="SIGNED_IN" && session){
  console.log("ログイン状態を復元しました。");
 }
});

startApp();

</script>
