<script>

/* =====================================
   Supabase
===================================== */

const SUPABASE_URL=
"https://kizcfsgfeurwlpwcfrzp.supabase.co";

/*
 ↓ここだけ自分のPublishable keyに変更
*/
const SUPABASE_PUBLISHABLE_KEY=
"sb_publishable_onwTGaCaOPH3LerDm0tXOA_KnjyS2hG";


const supabaseClient=
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_PUBLISHABLE_KEY
);


/* =====================================
   現在ユーザー
===================================== */

let currentUser=null;
let currentProfile=null;


/* =====================================
   メッセージ
===================================== */

function loginMessage(text){
 document.getElementById(
  "loginMessage"
 ).textContent=text;
}


/* =====================================
   登録
===================================== */

async function register(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 if(!email||!password){
  loginMessage(
   "メールアドレスとパスワードを入力してください。"
  );
  return;
 }

 const {error}=
 await supabaseClient.auth.signUp({
  email,
  password
 });

 if(error){
  loginMessage(error.message);
  return;
 }

 loginMessage(
  "登録しました。メール確認が必要な場合はメールを確認してください。"
 );
}


/* =====================================
   ログイン
===================================== */

async function login(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 if(!email||!password){
  loginMessage(
   "メールアドレスとパスワードを入力してください。"
  );
  return;
 }

 const {data,error}=
 await supabaseClient.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  loginMessage(error.message);
  return;
 }

 await loadProfile();
}


/* =====================================
   プロフィール
===================================== */

async function loadProfile(){

 const {data,error}=
 await supabaseClient.auth.getUser();

 if(error||!data.user){
  showLogin();
  return;
 }

 currentUser=data.user;

 const result=
 await supabaseClient
 .from("profiles")
 .select(
  "id,username,display_name,role,medals"
 )
 .eq("id",currentUser.id)
 .single();

 if(result.error){

  alert(
   "プロフィール取得エラー\n"+
   result.error.message
  );

  return;
 }

 currentProfile=result.data;

 document
 .getElementById("loginPage")
 .classList.add("hidden");

 document
 .getElementById("mainPage")
 .classList.remove("hidden");

 document
 .getElementById("welcome")
 .textContent=
 "こんにちは、"+
 (
  currentProfile.display_name||
  currentProfile.username||
  currentUser.email
 )+
 " さん";

 document
 .getElementById("medalCount")
 .textContent=
 currentProfile.medals;

 if(currentProfile.role==="admin"){

  document
  .getElementById("adminPage")
  .classList.remove("hidden");

 }else{

  document
  .getElementById("adminPage")
  .classList.add("hidden");

 }
}


/* =====================================
   ユーザー一覧
===================================== */

async function loadUsers(){

 if(!currentProfile||
    currentProfile.role!=="admin"){

  alert("管理者権限がありません。");
  return;
 }

 const {data,error}=
 await supabaseClient
 .from("profiles")
 .select(
  "id,username,display_name,role,medals"
 )
 .order("created_at",{ascending:false});

 if(error){
  alert(error.message);
  return;
 }

 const list=
 document.getElementById("userList");

 list.innerHTML="<h3>👤 ユーザー一覧</h3>";

 data.forEach(user=>{

  const div=
  document.createElement("div");

  div.className="user";

  div.innerHTML=`

   <strong>
   ${escapeHtml(
    user.display_name||
    user.username||
    "ユーザー"
   )}
   </strong>

   <br>

   🪙
   <span id="medal-${user.id}">
   ${user.medals}
   </span> 枚

   <br>

   <small>
   権限：${escapeHtml(user.role)}
   </small>

   <input
    id="amount-${user.id}"
    type="number"
    min="1"
    value="100"
    placeholder="枚数">

   <input
    id="reason-${user.id}"
    value="管理者によるメダル変更"
    placeholder="理由">

   <button
    onclick="changeMedals('${user.id}',1)">
    ➕ 増やす
   </button>

   <button
    onclick="changeMedals('${user.id}',-1)">
    ➖ 減らす
   </button>
  `;

  list.appendChild(div);
 });
}


/* =====================================
   メダル遠隔増減
===================================== */

async function changeMedals(
 userId,
 direction
){

 const amount=
 Number(
  document.getElementById(
   "amount-"+userId
  ).value
 );

 const reason=
 document.getElementById(
  "reason-"+userId
 ).value.trim();

 if(!Number.isInteger(amount)||amount<=0){
  alert("1以上の整数を入力してください。");
  return;
 }

 const {data,error}=
 await supabaseClient.rpc(
  "admin_change_medals",
  {
   target_user_id:userId,
   medal_amount:direction*amount,
   reason:
    reason||
    "管理者によるメダル変更"
  }
 );

 if(error){
  alert(
   "変更できませんでした。\n"+
   error.message
  );
  return;
 }

 document.getElementById(
  "medal-"+userId
 ).textContent=data;

 if(
  currentUser &&
  userId===currentUser.id
 ){
  document.getElementById(
   "medalCount"
  ).textContent=data;
 }

 alert(
  "メダル変更完了！\n"+
  "現在："+data+"枚"
 );
}


/* =====================================
   クレーン
===================================== */

let craneX=45;

function openCrane(){

 hideAllPages();

 document
 .getElementById("cranePage")
 .classList.remove("hidden");
}

function moveCrane(direction){

 craneX+=direction*5;

 if(craneX<5) craneX=5;
 if(craneX>90) craneX=90;

 document
 .getElementById("crane")
 .style.left=
 craneX+"%";
}

function grabPrize(){

 const message=
 document.getElementById(
  "craneMessage"
 );

 message.textContent=
 "🦾 アーム下降……";

 setTimeout(()=>{
  message.textContent=
   "🤏 景品をつかんでいます……";
 },700);

 setTimeout(()=>{
  const success=
   Math.random()<0.35;

  if(success){

   message.textContent=
    "🎉 景品ゲット！";

  }else{

   message.textContent=
    "ポロッ……😵 景品が落ちました。";

  }

 },1800);
}


/* =====================================
   プッシャー
===================================== */

function openPusher(){

 hideAllPages();

 document
 .getElementById("pusherPage")
 .classList.remove("hidden");
}

function dropMedal(){

 if(
  !currentProfile||
  currentProfile.medals<=0
 ){
  alert("メダルがありません。");
  return;
 }

 document
 .getElementById("pusherMessage")
 .textContent=
 "🪙 メダルを投入しました！";

 /*
   実際のメダル減算は次の段階で
   Supabase RPCに接続します。
 */
}


/* =====================================
   さいころ
===================================== */

function openDice(){

 hideAllPages();

 document
 .getElementById("dicePage")
 .classList.remove("hidden");
}

function rollDice(){

 const ball=
 document.getElementById("diceBall");

 const message=
 document.getElementById("diceMessage");

 ball.textContent="🔵";

 message.textContent=
 "ボールがチェッカーへ……";

 setTimeout(()=>{

  const number=
   Math.floor(Math.random()*6)+1;

  ball.textContent="🎲";

  message.textContent=
   "🎲 出た目："+number;

 },1500);
}


/* =====================================
   ショップ
===================================== */

function openShop(){

 hideAllPages();

 document
 .getElementById("shopPage")
 .classList.remove("hidden");

 document
 .getElementById("shopItems")
 .innerHTML=`
  <div class="game">
   <h2>🎁 テスト景品</h2>
   <p>1000メダル</p>
   <button>
    購入
   </button>
  </div>
 `;
}


/* =====================================
   ギフトコード
===================================== */

function openGift(){

 hideAllPages();

 document
 .getElementById("giftPage")
 .classList.remove("hidden");
}

function useGiftCode(){

 const code=
 document.getElementById(
  "giftCode"
 ).value.trim();

 if(!code){
  alert("コードを入力してください。");
  return;
 }

 document
 .getElementById("giftMessage")
 .textContent=
 "🎁 ギフトコード機能はSupabase接続後に有効になります。";
}


/* =====================================
   管理者メニュー
===================================== */

function openAdminCrane(){

 alert(
  "🦾 クレーン台管理\n\n"+
  "景品変更・在庫・アームパワー設定を"+
  "次の段階でSupabaseに接続します。"
 );
}

function openAdminShop(){

 alert(
  "🛍️ ショップ商品管理\n\n"+
  "管理者が商品を作成・編集できる画面を"+
  "次の段階で追加します。"
 );
}

function openAdminGift(){

 alert(
  "🎁 ギフトコード管理\n\n"+
  "管理者がコード・メダル数・期限を"+
  "設定できる画面を追加します。"
 );
}


/* =====================================
   戻る
===================================== */

function closeGames(){

 hideAllPages();

 document
 .getElementById("mainPage")
 .classList.remove("hidden");

}


/* =====================================
   全画面非表示
===================================== */

function hideAllPages(){

 [
  "mainPage",
  "cranePage",
  "pusherPage",
  "dicePage",
  "shopPage",
  "giftPage"
 ].forEach(id=>{
  document
  .getElementById(id)
  .classList.add("hidden");
 });
}


/* =====================================
   ログアウト
===================================== */

async function logout(){

 await supabaseClient.auth.signOut();

 currentUser=null;
 currentProfile=null;

 hideAllPages();
 showLogin();
}

function showLogin(){

 document
 .getElementById("loginPage")
 .classList.remove("hidden");
}


/* =====================================
   HTMLエスケープ
===================================== */

function escapeHtml(value){

 return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* =====================================
   起動
===================================== */

async function startApp(){

 const {data}=
 await supabaseClient.auth.getSession();

 if(data.session){

  await loadProfile();

 }else{

  showLogin();

 }
}

startApp();

</script>

</body>
</html>
