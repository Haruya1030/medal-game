<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111722">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>メダルゲームセンター</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080808;color:#fff}.wrap{width:min(95%,760px);margin:20px auto}.card{background:#1b1b1b;border:1px solid #444;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #000}h1,h2,h3{text-align:center}input,button,select,textarea{width:100%;padding:13px;margin-top:9px;border-radius:10px;border:0;font-size:16px}input,select,textarea{background:#303030;color:#fff}button{background:#555;color:#fff;cursor:pointer}button:hover{background:#777}.hidden{display:none}.medal{text-align:center;font-size:34px;margin:18px 0}.admin{border:2px solid gold}.user,.game{background:#272727;padding:14px;border-radius:12px;margin-top:12px}.msg{color:#ff7777;white-space:pre-line}.success{color:#7cff7c;white-space:pre-line}.muted{color:#aaa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#444}.pass{border:2px solid #aaa}.vip{border-color:gold}.danger{background:#7d2525}.small{font-size:13px}.machine{background:#111;border:7px solid #555;border-radius:16px;height:360px;position:relative;overflow:hidden}.rail{position:absolute;top:30px;left:10%;right:10%;height:8px;background:#777}.claw{position:absolute;top:35px;left:45%;width:70px;height:90px;transition:left .18s}.rope{width:8px;height:55px;background:#aaa;margin:auto}.head{width:60px;height:15px;background:#bbb;border-radius:10px;margin:auto}.hands{display:flex;justify-content:space-between}.hand{width:10px;height:35px;background:#aaa}.prizes{position:absolute;bottom:55px;left:10%;right:10%;height:80px;background:#444;border-radius:15px;display:flex;align-items:center;justify-content:space-around;font-size:32px}.outlet{position:absolute;bottom:0;left:35%;right:35%;height:45px;background:#111;border:3px solid #777;text-align:center;padding:8px}.pusher{height:320px;background:linear-gradient(#444,#222);border-radius:15px;position:relative;overflow:hidden;padding:20px}.coinpile{font-size:28px;line-height:42px;text-align:center}.pushboard{position:absolute;left:5%;right:5%;bottom:75px;height:45px;background:#999;border-radius:12px;animation:push 1.8s infinite alternate}.dropzone{position:absolute;bottom:0;left:35%;right:35%;height:55px;background:#111;border:3px solid #777;text-align:center;padding:10px}@keyframes push{from{transform:translateX(-3px)}to{transform:translateX(8px)}}.diceboard{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:#222;padding:8px;border-radius:12px}.cell{font-size:10px;text-align:center;padding:7px 2px;background:#333;border-radius:5px}.cell.current{outline:3px solid gold;background:#6b5310}.cell.goal{background:#174f2b}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:7px;border-bottom:1px solid #444;text-align:left}.qr{font-family:monospace;font-size:18px;letter-spacing:2px;background:#111;padding:12px;text-align:center}.topbar{position:sticky;top:0;z-index:5;background:#111;padding:8px;border-radius:12px;margin-bottom:10px}.topbar button{width:auto;margin:3px;padding:9px 12px}.section-title{margin-top:5px}.notice{padding:10px;background:#202a35;border-radius:10px;margin-top:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid,.two{grid-template-columns:1fr}.wrap{width:94%}.diceboard{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div id="loginPage" class="card">
<h1>🎮 メダルゲームセンター</h1><h2>🔐 ログイン</h2>
<input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード">
<button onclick="login()">ログイン</button><button onclick="register()">新規登録</button>
<label style="display:block;margin-top:12px"><input id="rememberLogin" type="checkbox" checked style="width:auto;margin-right:8px">ログイン状態を保持する</label>
<button onclick="resendVerification()">📧 確認メールを再送する</button><button id="installAppButton" class="hidden" onclick="installApp()">📱 アプリをインストール</button>
<div id="loginMessage" class="msg"></div>
</div>

<div id="mainPage" class="hidden">
<div class="topbar"><span>🪙 <strong id="medalCount">0</strong> 枚</span> <span style="float:right" id="activePassBadge"></span></div>
<div class="card"><h1>🎮 メダルゲームセンター</h1><p id="welcome"></p>
<div class="medal">🪙 <span id="homeMedals">0</span> 枚</div>
<div class="game"><h2>🎁 ログインボーナス</h2><p id="loginBonusStatus">確認中…</p><button onclick="claimLoginBonus()">🎁 今日のボーナス</button></div>
<div class="grid"><button onclick="openCrane()">🦾 クレーンゲーム</button><button onclick="openPusher()">🪙 メダルプッシャー</button><button onclick="openDice()">🎲 100マスさいころ</button><button onclick="openShop()">🛍️ ショップ</button><button onclick="openPasses()">🎫 パス購入</button><button onclick="openGift()">🎁 ギフトコード</button></div>
<div class="notice">💰 はるやコイン連携欄：準備済み。後からpt交換・連携機能を追加できます。</div>
<button onclick="checkForUpdate()">🔄 アップデート確認</button><button id="applyUpdateButton" class="hidden" onclick="applyAppUpdate()">✨ 新しいバージョンを適用</button><div id="updateMessage" class="success"></div>
<button onclick="logout()">🚪 ログアウト</button></div>
<div id="adminPage" class="card admin hidden"><h2>👑 管理者画面</h2>
<div class="grid"><button onclick="loadUsers()">👤 アカウント管理</button><button onclick="loadMachines()">🦾 クレーン台管理</button><button onclick="adminTestCrane()">🧪 クレーンテスト</button><button onclick="adminTestPusher()">🧪 プッシャーテスト</button><button onclick="loadDiceAdmin()">🎲 さいころ設定</button><button onclick="loadProductsAdmin()">🛍️ 商品管理</button><button onclick="loadGiftAdmin()">🎁 ギフト管理</button><button onclick="loadPassAdmin()">🎫 パス管理</button><button onclick="loadLoginBonusAdmin()">🎁 ログボ管理</button></div>
<div id="adminArea"></div></div>
</div>

<div id="cranePage" class="card hidden"><h1>🦾 クレーンゲーム</h1><p>台を選択してください</p><div id="machineButtons" class="grid"></div><p id="cranePrice" style="text-align:center;font-size:20px"></p>
<div class="machine"><div class="rail"></div><div id="claw" class="claw"><div class="rope"></div><div class="head"></div><div class="hands"><div class="hand" style="transform:rotate(20deg)"></div><div class="hand" style="transform:rotate(-20deg)"></div></div></div><div id="prizes" class="prizes">🎁 🎁 🎁 🎁 🎁</div><div class="outlet">景品出口</div></div>
<div class="grid"><button onclick="moveCrane(-1)">⬅️ 左</button><button onclick="moveCrane(1)">➡️ 右</button></div><button onclick="grabPrize()">🦾 つかむ</button><button onclick="closeGames()">戻る</button><div id="craneMessage"></div></div>

<div id="pusherPage" class="card hidden"><h1>🪙 メダルプッシャー</h1><div class="pusher"><div id="coinpile" class="coinpile">🪙 🪙 🪙 🪙 🪙<br>🪙 🪙 🪙 🪙 🪙<br>🪙 🪙 🪙 🪙 🪙<br>🪙 🪙 🪙 🪙 🪙</div><div class="pushboard"></div><div class="dropzone">メダル出口</div></div><button onclick="dropMedal()">🪙 メダルを投入（1枚）</button><button onclick="closeGames()">戻る</button><div id="pusherMessage"></div></div>

<div id="dicePage" class="card hidden"><h1>🎲 100マスさいころ</h1><p id="diceStatus" style="text-align:center">現在位置：1 / 100</p><div id="diceBoard" class="diceboard"></div><button onclick="rollDice()">🎲 ボールを落とす（5枚）</button><button onclick="closeGames()">戻る</button><div id="diceMessage"></div></div>

<div id="shopPage" class="card hidden"><h1>🛍️ ショップ</h1><div id="shopItems"></div><button onclick="closeGames()">戻る</button></div>
<div id="giftPage" class="card hidden"><h1>🎁 ギフトコード</h1><input id="giftCode" placeholder="ギフトコード"><button onclick="useGiftCode()">コードを使用</button><div id="giftMessage"></div><button onclick="closeGames()">戻る</button></div>
<div id="passPage" class="card hidden"><h1>🎫 パス</h1><div id="passItems"></div><button onclick="closeGames()">戻る</button><div id="passMessage"></div></div>
</div>

<script>
const SUPABASE_URL="https://kizcfsgfeurwlpwcfrzp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_onwTGaCaOPH3LerDm0tXOA_KnjyS2hG";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});
let currentUser=null,currentProfile=null,currentMachine=1,craneX=45,cranePlaying=false,passSettingsCache=[],myPassesCache=[],dicePosition=1,deferredInstallPrompt=null,waitingServiceWorker=null;
const $=id=>document.getElementById(id); const msg=(id,t)=>{if($(id))$(id).textContent=t};
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function showLogin(){$('loginPage').classList.remove('hidden');$('mainPage').classList.add('hidden')}
function hideAllPages(){['mainPage','cranePage','pusherPage','dicePage','shopPage','giftPage','passPage'].forEach(id=>$(id)?.classList.add('hidden'))}
function closeGames(){hideAllPages();$('mainPage').classList.remove('hidden')}
function updateBalance(n){currentProfile.medals=Number(n);$('medalCount').textContent=n;$('homeMedals').textContent=n}
function loginMessage(t){msg('loginMessage',t)}
async function register(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return loginMessage('メールアドレスとパスワードを入力してください。');if(password.length<6)return loginMessage('パスワードは6文字以上です。');const {data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:'https://haruya1030.github.io/medal-game/'}});if(error)return loginMessage(error.message);loginMessage(data.session?'登録・ログインしました。':'📧 登録しました。確認メールを確認してください。');if(data.session)await loadProfile()}
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return loginMessage('メールアドレスとパスワードを入力してください。');if($('rememberLogin').checked)localStorage.setItem('medalGameRememberEmail',email);else localStorage.removeItem('medalGameRememberEmail');const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){const s=String(error.message||'');return loginMessage(s.toLowerCase().includes('email not confirmed')?'📧 確認メールを先に開いてください。':s)}await loadProfile()}
async function resendVerification(){const email=$('email').value.trim();if(!email)return loginMessage('メールアドレスを入力してください。');const {error}=await supabaseClient.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://haruya1030.github.io/medal-game/'}});loginMessage(error?error.message:'📧 確認メールを再送しました。')}
function restoreLoginData(){const e=localStorage.getItem('medalGameRememberEmail');if(e)$('email').value=e}
async function loadProfile(){const {data,error}=await supabaseClient.auth.getUser();if(error||!data.user)return showLogin();currentUser=data.user;const {data:p,error:e}=await supabaseClient.from('profiles').select('id,username,display_name,role,medals').eq('id',currentUser.id).single();if(e)return alert('プロフィール取得エラー\n'+e.message);currentProfile=p;$('loginPage').classList.add('hidden');$('mainPage').classList.remove('hidden');$('welcome').textContent='こんにちは、'+(p.display_name||p.username||currentUser.email)+' さん';updateBalance(p.medals);await Promise.all([loadPasses(),loadLoginBonusStatus(),loadDiceState()]);if(p.role==='admin'){$('adminPage').classList.remove('hidden')}else $('adminPage').classList.add('hidden')}
async function logout(){await supabaseClient.auth.signOut();currentUser=null;currentProfile=null;showLogin()}

async function loadLoginBonusAmount(){const {data}=await supabaseClient.from('app_settings').select('value').eq('key','daily_login_bonus').maybeSingle();return Number(data?.value||50)}
async function claimLoginBonus(){const {data,error}=await supabaseClient.rpc('claim_daily_login_bonus');if(error){msg('loginBonusStatus',String(error.message).includes('ALREADY_CLAIMED')?'✅ 今日のログインボーナスは受け取り済みです。':error.message);return}updateBalance(data.remaining_medals);msg('loginBonusStatus','🎉 '+data.bonus+'枚受け取りました！')}
async function loadLoginBonusStatus(){const amount=await loadLoginBonusAmount();const {data,error}=await supabaseClient.rpc('claim_daily_login_bonus');if(error){msg('loginBonusStatus',String(error.message).includes('ALREADY_CLAIMED')?'✅ 今日のボーナスは受け取り済みです。':'🎁 今日のボーナス：'+amount+'枚');return}updateBalance(data.remaining_medals);msg('loginBonusStatus','🎉 ログインボーナス '+data.bonus+'枚を受け取りました！')}

async function loadPasses(){const a=await supabaseClient.from('pass_settings').select('*').order('sort_order');passSettingsCache=a.data||[];const b=await supabaseClient.from('user_passes').select('pass_type,expires_at,last_daily_claimed_at').eq('user_id',currentUser.id);myPassesCache=b.data||[];const active=myPassesCache.filter(x=>new Date(x.expires_at)>new Date());$('activePassBadge').textContent=active.length?'🎫 '+active.map(x=>x.pass_type).join(' / '):''}
function activePass(){const now=Date.now();return myPassesCache.map(p=>({...p,setting:passSettingsCache.find(s=>s.pass_type===p.pass_type)})).filter(p=>new Date(p.expires_at).getTime()>now).sort((a,b)=>Number(b.setting?.daily_bonus||0)-Number(a.setting?.daily_bonus||0))[0]}
function craneCost(){return Number(activePass()?.setting?.crane_cost||10)}
async function openPasses(){hideAllPages();$('passPage').classList.remove('hidden');await loadPasses();const box=$('passItems');box.innerHTML='';for(const p of passSettingsCache){const owned=myPassesCache.find(x=>x.pass_type===p.pass_type&&new Date(x.expires_at)>new Date());const d=document.createElement('div');d.className='game '+(p.pass_type==='vip'?'vip':'pass');d.innerHTML='<h2>'+escapeHtml(p.icon)+' '+escapeHtml(p.name)+'</h2><p>'+escapeHtml(p.description)+'</p><p>💰 '+Number(p.price_medals)+'枚 / 📅 '+p.duration_days+'日 / 🎁 '+p.daily_bonus+'枚/日 / 🦾 '+p.crane_cost+'枚</p>'+(owned?'<p class="success">✅ 有効中：'+new Date(owned.expires_at).toLocaleString('ja-JP')+'</p>':p.pass_type==='vip'?'<p>👑 管理者発行のみ</p>':p.enabled?'<button onclick="buyPass(\''+p.pass_type+'\')">🎫 購入</button>':'<p class="msg">販売停止中</p>');box.appendChild(d)}const b=document.createElement('div');b.className='game';b.innerHTML='<h2>🎁 パス毎日ボーナス</h2><button onclick="claimPassBonus()">今日のパスボーナスを受け取る</button>';box.appendChild(b)}
async function buyPass(type){const {data,error}=await supabaseClient.rpc('purchase_user_pass',{p_pass_type:type});if(error)return alert('購入できませんでした。\n'+error.message);updateBalance(data.remaining_medals);await loadPasses();await openPasses();alert('🎉 '+data.pass_name+'を購入しました！')}
async function claimPassBonus(){const {data,error}=await supabaseClient.rpc('claim_pass_daily_bonus');if(error)return alert('パスボーナスを受け取れませんでした。\n'+error.message);updateBalance(data.remaining_medals);await loadPasses();msg('passMessage','🎁 '+data.pass_name+'：'+data.bonus+'枚を受け取りました！')}

async function loadUsers(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const {data,error}=await supabaseClient.from('profiles').select('id,username,display_name,role,medals').order('created_at',{ascending:false});if(error)return alert(error.message);const box=$('adminArea');box.innerHTML='<h3>👤 アカウント管理</h3>';for(const u of data){const d=document.createElement('div');d.className='user';d.innerHTML='<strong>'+escapeHtml(u.display_name||u.username||'ユーザー')+'</strong><p>🪙 <span id="m-'+u.id+'">'+u.medals+'</span>枚 / '+escapeHtml(u.role)+'</p><select id="r-'+u.id+'"><option value="user" '+(u.role==='user'?'selected':'')+'>一般ユーザー</option><option value="admin" '+(u.role==='admin'?'selected':'')+'>管理者</option></select><button onclick="setRole(\''+u.id+'\')">🛡️ 権限変更</button><button onclick="issueVip(\''+u.id+'\')">👑 VIP発行</button><input id="a-'+u.id+'" type="number" min="1" value="100"><input id="reason-'+u.id+'" value="管理者によるメダル変更"><div class="two"><button onclick="changeMedals(\''+u.id+'\',1)">➕ 増やす</button><button onclick="changeMedals(\''+u.id+'\',-1)">➖ 減らす</button></div>';box.appendChild(d)}}
async function setRole(id){const role=$('r-'+id).value;if(id===currentUser.id&&role!=='admin')return alert('自分自身の管理者権限は外せません。');const {error}=await supabaseClient.rpc('admin_set_user_role',{target_user_id:id,new_role:role});if(error)return alert(error.message);await loadUsers()}
async function changeMedals(id,dir){const amount=Number($('a-'+id).value);if(!Number.isInteger(amount)||amount<=0)return alert('1以上の整数を入力してください。');const {data,error}=await supabaseClient.rpc('admin_change_medals',{target_user_id:id,medal_amount:dir*amount,reason:$('reason-'+id).value||'管理者によるメダル変更'});if(error)return alert(error.message);$('m-'+id).textContent=data;if(id===currentUser.id)updateBalance(data)}
async function issueVip(id){const days=Number(prompt('VIPの有効日数','30'));if(!Number.isInteger(days)||days<=0)return;const {error}=await supabaseClient.rpc('admin_issue_vip_pass',{target_user_id:id,duration_days:days});if(error)return alert(error.message);alert('👑 VIPを発行しました！')}

async function loadMachines(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const {data,error}=await supabaseClient.from('crane_machines').select('*').order('machine_no');if(error)return alert(error.message);const box=$('adminArea');box.innerHTML='<h3>🦾 クレーン台管理</h3><button onclick="addMachine()">➕ 台を追加</button>';for(const m of data){const d=document.createElement('div');d.className='user';d.innerHTML='<strong>台'+m.machine_no+'：'+escapeHtml(m.name)+'</strong><input id="mn-'+m.id+'" value="'+escapeHtml(m.name)+'"><input id="mp-'+m.id+'" value="'+escapeHtml(m.prize_name)+'"><input id="mc-'+m.id+'" type="number" min="1" value="'+m.arm_power+'" placeholder="アームパワー（管理者のみ）"><input id="ms-'+m.id+'" type="number" min="0" value="'+m.stock+'" placeholder="在庫"><label><input id="me-'+m.id+'" type="checkbox" '+(m.enabled?'checked':'')+'> 使用ON</label><button onclick="saveMachine('+m.id+')">💾 保存</button></div>';box.appendChild(d)}}
async function saveMachine(id){const payload={name:$('mn-'+id).value,prize_name:$('mp-'+id).value,arm_power:Number($('mc-'+id).value),stock:Number($('ms-'+id).value),enabled:$('me-'+id).checked};const {error}=await supabaseClient.from('crane_machines').update(payload).eq('id',id);if(error)return alert(error.message);alert('保存しました！')}
async function addMachine(){const no=Number(prompt('台番号','10'));if(!Number.isInteger(no))return;const {error}=await supabaseClient.from('crane_machines').insert({machine_no:no,name:'新しいクレーン台',prize_name:'景品',arm_power:50,stock:1,enabled:true});if(error)alert(error.message);else loadMachines()}
async function adminTestCrane(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');alert('🦾 管理者テスト：アーム動作を確認できます。景品は減りません。')}
async function adminTestPusher(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const {data,error}=await supabaseClient.rpc('admin_test_pusher');if(error)return alert(error.message);alert('🧪 テスト払い出し：'+data.payout+'枚')}
async function loadDiceAdmin(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const {data,error}=await supabaseClient.from('dice_events').select('*').order('position');if(error)return alert(error.message);const box=$('adminArea');box.innerHTML='<h3>🎲 さいころイベント管理</h3><p class="muted">100マスのイベントを編集できます。</p>';for(const e of data||[]){const d=document.createElement('div');d.className='user';d.innerHTML='<strong>'+e.position+'マス</strong><input id="dt-'+e.id+'" value="'+escapeHtml(e.title)+'"><input id="de-'+e.id+'" type="number" value="'+e.effect+'"><input id="dm-'+e.id+'" value="'+escapeHtml(e.message)+'"><label><input id="dx-'+e.id+'" type="checkbox" '+(e.enabled?'checked':'')+'> ON</label><button onclick="saveDiceEvent('+e.id+')">💾 保存</button>';box.appendChild(d)}}
async function saveDiceEvent(id){const {error}=await supabaseClient.from('dice_events').update({title:$('dt-'+id).value,effect:Number($('de-'+id).value),message:$('dm-'+id).value,enabled:$('dx-'+id).checked}).eq('id',id);if(error)return alert(error.message);alert('イベントを保存しました！')}
async function loadProductsAdmin(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const {data,error}=await supabaseClient.from('shop_products').select('*').order('id');if(error)return alert(error.message);const box=$('adminArea');box.innerHTML='<h3>🛍️ 商品管理</h3><button onclick="addProduct()">➕ 商品追加</button>';for(const p of data){const d=document.createElement('div');d.className='user';d.innerHTML='<input id="pn-'+p.id+'" value="'+escapeHtml(p.name)+'"><input id="pd-'+p.id+'" value="'+escapeHtml(p.description||'')+'"><input id="pp-'+p.id+'" type="number" min="0" value="'+Number(p.medal_price||p.price_medals||0)+'"><input id="ps-'+p.id+'" type="number" min="0" value="'+Number(p.stock||0)+'"><label><input id="pe-'+p.id+'" type="checkbox" '+(p.enabled?'checked':'')+'> 販売ON</label><button onclick="saveProduct('+p.id+')">💾 保存</button></div>';box.appendChild(d)}}
async function saveProduct(id){const price=Number($('pp-'+id).value);const payload={name:$('pn-'+id).value,description:$('pd-'+id).value,medal_price:price,stock:Number($('ps-'+id).value),enabled:$('pe-'+id).checked,updated_at:new Date().toISOString()};const {error}=await supabaseClient.from('shop_products').update(payload).eq('id',id);if(error)return alert(error.message);alert('保存しました！')}
async function addProduct(){const name=prompt('商品名','テスト景品');if(!name)return;const {error}=await supabaseClient.from('shop_products').insert({name,description:'',icon:'🎁',medal_price:1000,stock:1,enabled:true});if(error)alert(error.message);else loadProductsAdmin()}
async function loadGiftAdmin(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const {data,error}=await supabaseClient.from('gift_codes').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);const box=$('adminArea');box.innerHTML='<h3>🎁 ギフトコード管理</h3><button onclick="createGift()">➕ コード作成</button><div id="giftAdminList"></div>';const list=$('giftAdminList');for(const g of data||[]){const d=document.createElement('div');d.className='user';d.innerHTML='<strong>'+escapeHtml(g.code)+'</strong><p>🪙 '+Number(g.medals||0)+'枚 / 使用回数 '+Number(g.use_count||0)+' / 上限 '+Number(g.max_uses||1)+'</p><p>期限：'+(g.expires_at?new Date(g.expires_at).toLocaleString('ja-JP'):'なし')+'</p>';list.appendChild(d)}}
async function createGift(){const code=prompt('ギフトコード','MEDAL-'+Math.random().toString(36).slice(2,8).toUpperCase());if(!code)return;const medals=Number(prompt('メダル枚数','100'));if(!Number.isInteger(medals)||medals<=0)return;const max=Number(prompt('使用回数','1'));if(!Number.isInteger(max)||max<=0)return;const {error}=await supabaseClient.from('gift_codes').insert({code,medals,max_uses:max,use_count:0,enabled:true});if(error)alert(error.message);else loadGiftAdmin()}
async function useGiftCode(){const code=$('giftCode').value.trim();if(!code)return alert('コードを入力してください。');const {data,error}=await supabaseClient.rpc('use_gift_code',{p_code:code});if(error)return msg('giftMessage',error.message);updateBalance(data.remaining_medals);msg('giftMessage','🎉 '+data.medals+'枚受け取りました！')}

async function loadPassAdmin(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const {data,error}=await supabaseClient.from('pass_settings').select('*').order('sort_order');if(error)return alert(error.message);const box=$('adminArea');box.innerHTML='<h3>🎫 パス管理</h3>';for(const p of data){const d=document.createElement('div');d.className='user';d.innerHTML='<strong>'+escapeHtml(p.icon)+' '+escapeHtml(p.name)+'</strong><input id="pprice-'+p.pass_type+'" type="number" value="'+p.price_medals+'"><input id="pdays-'+p.pass_type+'" type="number" value="'+p.duration_days+'"><input id="pdaily-'+p.pass_type+'" type="number" value="'+p.daily_bonus+'"><input id="pcrane-'+p.pass_type+'" type="number" value="'+p.crane_cost+'"><input id="pdesc-'+p.pass_type+'" value="'+escapeHtml(p.description)+'"><label><input id="pen-'+p.pass_type+'" type="checkbox" '+(p.enabled?'checked':'')+'> 販売ON</label><button onclick="savePass(\''+p.pass_type+'\')">💾 保存</button></div>';box.appendChild(d)}}
async function savePass(t){const payload={price_medals:Number($('pprice-'+t).value),duration_days:Number($('pdays-'+t).value),daily_bonus:Number($('pdaily-'+t).value),crane_cost:Number($('pcrane-'+t).value),description:$('pdesc-'+t).value,enabled:$('pen-'+t).checked,updated_at:new Date().toISOString()};const {error}=await supabaseClient.from('pass_settings').update(payload).eq('pass_type',t);if(error)return alert(error.message);alert('保存しました！')}
async function loadLoginBonusAdmin(){if(currentProfile?.role!=='admin')return alert('管理者権限がありません。');const n=await loadLoginBonusAmount();const box=$('adminArea');box.innerHTML='<h3>🎁 ログインボーナス管理</h3><input id="lb" type="number" min="1" value="'+n+'"><button onclick="saveLoginBonus()">💾 保存</button>'}
async function saveLoginBonus(){const n=Number($('lb').value);if(!Number.isInteger(n)||n<=0)return;const {error}=await supabaseClient.from('app_settings').upsert({key:'daily_login_bonus',value:String(n),updated_at:new Date().toISOString()},{onConflict:'key'});if(error)alert(error.message);else alert('ログインボーナスを変更しました！')}

async function openCrane(){hideAllPages();$('cranePage').classList.remove('hidden');await loadMachinesForUser()}
async function loadMachinesForUser(){const {data,error}=await supabaseClient.from('crane_machines').select('id,machine_no,name,prize_name,enabled').eq('enabled',true).order('machine_no');if(error)return msg('craneMessage',error.message);const b=$('machineButtons');b.innerHTML='';for(const m of data){const x=document.createElement('button');x.textContent='台'+m.machine_no+' '+m.name;x.onclick=()=>selectMachine(m);b.appendChild(x)}if(data[0])selectMachine(data[0])}
function selectMachine(m){currentMachine=m.id;const name=m.name;msg('craneMessage','選択中：台'+m.machine_no+' '+name+' / 景品：'+m.prize_name);$('cranePrice').textContent='プレイ料金：🪙 '+craneCost()+'枚';$('prizes').textContent='🎁 '+m.prize_name+' 🎁';craneX=45;$('claw').style.left=craneX+'%'}
function moveCrane(dir){if(cranePlaying)return;craneX=Math.max(5,Math.min(90,craneX+dir*5));$('claw').style.left=craneX+'%'}
async function grabPrize(){if(cranePlaying)return;cranePlaying=true;const cost=craneCost();const {data,error}=await supabaseClient.rpc('play_crane_game',{p_machine_id:currentMachine});if(error){alert('クレーンゲームを開始できませんでした。\n'+error.message);cranePlaying=false;return}updateBalance(data.remaining_medals);msg('craneMessage','🪙 '+cost+'枚使用。アーム下降……');setTimeout(()=>msg('craneMessage','🤏 景品をつかんでいます……'),700);setTimeout(()=>{msg('craneMessage',data.won?'🎉 景品ゲット！':'ポロッ……😵 景品が落ちました。');cranePlaying=false},1800)}

async function openPusher(){hideAllPages();$('pusherPage').classList.remove('hidden')}
async function dropMedal(){const {data,error}=await supabaseClient.rpc('play_pusher_game',{p_cost:1});if(error)return msg('pusherMessage',error.message);updateBalance(data.remaining_medals);$('coinpile').textContent='🪙 '.repeat(Math.min(35,10+data.payout*2))+'\n'+(data.payout?'🎉 払い出し '+data.payout+'枚':'');msg('pusherMessage','投入1枚 → '+(data.jackpot?'🎰 777 JACKPOT！\n🎡 ルーレット '+data.roulette+' → '+data.payout+'枚！':(data.is777?'777！ 777カウント '+data.count777+'/5\n':'')+(data.payout?'🎉 '+data.payout+'枚獲得！':'メダルが押し出されました。')))}

async function openDice(){hideAllPages();$('dicePage').classList.remove('hidden');await loadDiceState()}
async function loadDiceState(){if(!currentUser)return;const {data}=await supabaseClient.from('dice_states').select('position').eq('user_id',currentUser.id).maybeSingle();dicePosition=Number(data?.position||1);renderDiceBoard()}
function renderDiceBoard(){const b=$('diceBoard');if(!b)return;b.innerHTML='';for(let i=1;i<=100;i++){const d=document.createElement('div');d.className='cell '+(i===dicePosition?'current ':'')+(i===100?'goal':'');d.textContent=i;b.appendChild(d)}$('diceStatus').textContent='現在位置：'+dicePosition+' / 100'}
async function rollDice(){const {data,error}=await supabaseClient.rpc('play_dice_game',{p_cost:5});if(error)return msg('diceMessage',error.message);updateBalance(data.remaining_medals);dicePosition=Number(data.position);renderDiceBoard();msg('diceMessage','🎲 '+data.roll+'マス進みました！ '+(data.reward>0?'🪙 '+data.reward+'枚獲得！ ':'')+(data.position>=100?'🏆 ゴール！':'現在'+data.position+'マス'))}

async function openShop(){hideAllPages();$('shopPage').classList.remove('hidden');const {data,error}=await supabaseClient.from('shop_products').select('*').eq('enabled',true).order('id');if(error)return msg('shopItems',error.message);const box=$('shopItems');box.innerHTML='';for(const p of data||[]){const price=Number(p.medal_price??p.price_medals??0);const d=document.createElement('div');d.className='game';d.innerHTML='<h2>'+escapeHtml(p.icon||'🎁')+' '+escapeHtml(p.name)+'</h2><p>'+escapeHtml(p.description||'')+'</p><p>🪙 '+price+'枚 / 在庫 '+Number(p.stock||0)+'</p><button onclick="buyProduct('+p.id+')">購入</button>';box.appendChild(d)}}
async function buyProduct(id){const {data,error}=await supabaseClient.rpc('purchase_product',{p_product_id:id});if(error)return alert('購入できませんでした。\n'+error.message);updateBalance(data.remaining_medals);alert('🎉 購入しました！');openShop()}
function openGift(){hideAllPages();$('giftPage').classList.remove('hidden')}

function installApp(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>deferredInstallPrompt=null)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;$('installAppButton').classList.remove('hidden')});
function applyAppUpdate(){waitingServiceWorker?.postMessage({type:'SKIP_WAITING'})}
async function checkForUpdate(){const r=await navigator.serviceWorker?.getRegistration('./');if(!r)return msg('updateMessage','準備中です。');await r.update();msg('updateMessage',r.waiting?'🆕 新しいバージョンがあります。':'✅ 最新バージョンです。');if(r.waiting){waitingServiceWorker=r.waiting;$('applyUpdateButton').classList.remove('hidden')}}
if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const r=await navigator.serviceWorker.register('./sw.js',{scope:'./'});if(r.waiting)waitingServiceWorker=r.waiting}catch(e){console.error(e)}});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}

async function startApp(){restoreLoginData();const {data}=await supabaseClient.auth.getSession();if(data.session)await loadProfile();else showLogin()}
startApp();
</script>
</body></html>
